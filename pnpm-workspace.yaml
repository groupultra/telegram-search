packages:
  - packages/*
  - libs/*
  - apps/*

catalog:
  '@guiiai/logg': ^1.2.11
  '@unbird/result': ^1.1.1
  '@xsai-ext/providers-cloud': ^0.4.0-beta.12
  '@xsai-ext/providers-local': ^0.4.0-beta.12
  '@xsai/embed': ^0.4.4
  '@xsai/tool': ^0.4.4
  tsdown: ^0.20.3
  vue-sonner: ^2.0.9
  xsai: ^0.4.4

onlyBuiltDependencies:
  - '@parcel/watcher'
  - better-sqlite3
  - bufferutil
  - core-js
  - electron
  - electron-winstaller
  - es5-ext
  - esbuild
  - protobufjs
  - sharp
  - unrs-resolver
  - utf-8-validate
  - vue-demi
  - websocket
# unocss-preset-animations imports preset-mini at runtime but does not declare
# it, which breaks strict pnpm installs after lockfile deduplication.
packageExtensions:
  unocss-preset-animations@1.3.0:
    dependencies:
      '@unocss/preset-mini': 66.7.5

name: telegram-search
services:
  pgvector:
    image: ghcr.io/tensorchord/pgvecto-rs:pg17-v0.4.0
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DATABASE: postgres
      POSTGRES_PASSWORD: "123456"
    volumes:
      - ./drizzle/sql/pgrs-init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -d postgres -U postgres]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_PROMETHEUS_AUTH_TYPE: public
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  telegram-search:
    image: ghcr.io/groupultra/telegram-search:latest
    ports:
      - 3333:3333
    depends_on:
      pgvector:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - telegram-search-data:/app/data
    restart: unless-stopped
    environment:
      DATABASE_TYPE: postgres
      DATABASE_URL: "postgresql://postgres:123456@pgvector:5432/postgres"
      MINIO_URL: "http://minio:9000"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      OTEL_EXPORTER_OTLP_ENDPOINT: http://loki:3100/otlp/v1/logs
    healthcheck:
      test: [CMD-SHELL, "curl -f http://localhost:3333/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  loki:
    image: grafana/loki:latest
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    restart: unless-stopped

volumes:
  pgvector-data:
  telegram-search-data:
  minio-data:
  loki-data:
